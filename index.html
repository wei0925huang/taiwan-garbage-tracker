<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16a34a"><meta name="apple-mobile-web-app-capable" content="yes"><title>三市垃圾車資訊</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:#f8fafc;color:#1e293b}body{min-height:100dvh}.app{min-height:100dvh;display:flex;flex-direction:column}.head{background:white;border-bottom:1px solid #e2e8f0;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));z-index:500}.headin{max-width:1280px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;gap:10px;align-items:center;min-width:0}.logo{width:42px;height:42px;border-radius:12px;background:#16a34a;color:#fff;display:grid;place-items:center;font-size:22px}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:#64748b;margin:2px 0 0}.controls{display:flex;gap:8px;align-items:center}.btn,.field{height:36px;border:1px solid #cbd5e1;border-radius:9px;padding:0 11px;background:white;color:#334155;font-size:13px}.btn{font-weight:700;cursor:pointer}.green{background:#16a34a;color:white;border-color:#16a34a}.blue{background:#2563eb;color:white;border-color:#2563eb}.layout{width:100%;max-width:1280px;margin:auto;padding:12px;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:12px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px #0f172a0c}.left{display:flex;flex-direction:column;min-height:0}.bar{padding:10px;border-bottom:1px solid #e2e8f0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:220px}.status{font-size:12px;color:#475569;background:#f1f5f9;border-radius:8px;padding:7px 9px}.mapbox{padding:8px;background:#f1f5f9;flex:1;min-height:430px}.map{height:100%;min-height:430px;border-radius:11px}.side{display:flex;flex-direction:column;min-height:0}.sidehead{padding:11px 12px;border-bottom:1px solid #e2e8f0;background:#f8fafc;font-size:13px;display:flex;justify-content:space-between}.list{overflow:auto;min-height:0;padding:10px}.card{padding:11px;border:1px solid #e2e8f0;border-radius:11px;margin-bottom:8px;background:#f8fafc;cursor:pointer}.card:hover{background:#ecfdf5}.row{display:flex;justify-content:space-between;gap:7px}.plate{font-weight:800}.badge{font-size:11px;border-radius:6px;padding:2px 6px;background:white;border:1px solid #cbd5e1}.sub{font-size:12px;color:#475569;margin-top:5px}.empty{padding:35px 12px;text-align:center;color:#64748b;font-size:13px}.legend{font-size:11px;color:#64748b}.modal{position:fixed;inset:0;background:#0f172a99;z-index:1000;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.dialog{width:min(430px,100%);background:white;border-radius:15px;overflow:hidden}.dh{padding:13px 15px;background:#0f172a;color:white;display:flex;justify-content:space-between}.db{padding:15px;display:grid;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.db label{font-size:12px;font-weight:700}.df{padding:11px 15px;background:#f8fafc;display:flex;justify-content:flex-end;gap:8px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;background:#eff6ff;color:#1d4ed8;border:1px solid #93c5fd;border-radius:7px;padding:5px 7px}.chip button{border:0;background:none;color:#e11d48}.warn{color:#b45309;background:#fffbeb}.error{color:#be123c;background:#fff1f2}
@media(max-width:900px){body{overflow:auto}.headin{align-items:flex-start;flex-direction:column}.controls{width:100%;overflow-x:auto}.layout{display:flex;flex-direction:column;padding:8px}.mapbox,.map{height:52vh;min-height:350px}.list{overflow:visible}.side{min-height:300px}.grow{min-width:100%;order:4}.desk{display:none}}
@media(max-width:520px){.brand h1{font-size:16px}.brand p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:270px}.mapbox,.map{height:49vh;min-height:325px}.grid2{grid-template-columns:1fr}.dialog{max-height:calc(100dvh - 20px);overflow:auto}}
</style></head><body><div class="app"><header class="head"><div class="headin"><div class="brand"><div class="logo">♻</div><div><h1>三市垃圾車資訊整合</h1><p>臺北表定點位｜新北即時 GPS｜臺中動態車輛</p></div></div><div class="controls"><select id="city" class="field"><option value="newtaipei">新北市｜即時 GPS</option><option value="taichung">臺中市｜動態車輛</option><option value="taipei">臺北市｜表定點位</option></select><button id="locate" class="btn blue">◎ 我的地標</button><button id="refresh" class="btn green">↻ 更新</button></div></div></header><main class="layout"><section class="panel left"><div class="bar"><span id="source" class="status">載入中…</span><span id="fresh" class="status"></span><span id="timer" class="status desk"></span></div><div class="bar"><input id="search" class="field grow" placeholder="搜尋車牌、路線、行政區、地點"><button class="btn green flt" data-f="ALL">全部</button><button class="btn flt" data-f="MOVING">移動中</button><button class="btn flt" data-f="STOPPED">停靠／點位</button></div><div class="bar"><b style="font-size:12px">地標：</b><div id="chips" class="chips grow"></div><span class="legend">點地圖也可新增</span></div><div class="mapbox"><div id="map" class="map"></div></div></section><section class="panel side"><div class="sidehead"><b>資料清單</b><span><b id="count">0</b> 筆</span></div><div id="list" class="list"></div></section></main></div>
<div id="modal" class="modal"><div class="dialog"><div class="dh"><b>新增監控地標</b><button id="mx" class="btn">×</button></div><div class="db"><label>地標名稱<input id="lname" class="field" style="width:100%;margin-top:5px" placeholder="公司、家"></label><div class="grid2"><label>提醒半徑（公尺）<input id="radius" class="field" type="number" min="50" max="5000" value="200" style="width:100%;margin-top:5px"></label><label>座標<input id="coords" class="field" readonly style="width:100%;margin-top:5px"></label></div></div><div class="df"><button id="cancel" class="btn">取消</button><button id="save" class="btn blue">儲存</button></div></div></div>
<script>
const $=x=>document.getElementById(x),CFG={newtaipei:{file:'newtaipei-live.json',center:[25.012,121.466],zoom:11,label:'新北市政府環境保護局｜官方即時 GPS',interval:120},taichung:{file:'taichung-live.json',center:[24.163,120.648],zoom:11,label:'臺中市政府環境保護局｜官方動態資料',interval:600},taipei:{file:'taipei-schedule.json',center:[25.0375,121.5637],zoom:12,label:'臺北市政府環境保護局｜官方表定點位',interval:86400}},STORE='tw_garbage_landmarks_v2';let city='newtaipei',rows=[],meta={},filter='ALL',map,layer,lmLayer,pending=null,next=0;let landmarks=JSON.parse(localStorage.getItem(STORE)||'[]');
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function valid(x){return Number.isFinite(+x.latitude)&&Number.isFinite(+x.longitude)&&+x.latitude>21&&+x.latitude<26.6&&+x.longitude>118&&+x.longitude<123}
function markerIcon(x){const schedule=x.dataType==='SCHEDULE',moving=+x.speed>0,color=schedule?'#2563eb':moving?'#16a34a':'#f59e0b',symbol=schedule?'●':'♻';return L.divIcon({html:`<div style="width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:${color};color:#fff;border:2px solid white;box-shadow:0 2px 7px #0004;font-weight:bold">${symbol}</div>`,className:'',iconSize:[29,29],iconAnchor:[14,14]})}
function render(){const q=$('search').value.trim().toLowerCase(),data=rows.filter(x=>{const text=`${x.car} ${x.lineid} ${x.lineName} ${x.location} ${x.cityname}`.toLowerCase(),st=filter==='ALL'||filter==='MOVING'&&x.dataType!=='SCHEDULE'&&+x.speed>0||filter==='STOPPED'&&(x.dataType==='SCHEDULE'||+x.speed===0);return (!q||text.includes(q))&&st});layer.clearLayers();data.filter(valid).forEach(x=>L.marker([+x.latitude,+x.longitude],{icon:markerIcon(x)}).bindPopup(`<b>${safe(x.car||x.lineName||'清運點')}</b><br>${safe(x.location)}<br>${x.dataType==='SCHEDULE'?'表定：'+safe(x.arrival||x.time):'回報：'+safe(x.time)}${x.speed!==null&&x.speed!==undefined?'<br>速度：'+safe(x.speed)+' km/h':''}`).addTo(layer));$('list').innerHTML=data.length?data.map((x,i)=>`<div class="card" data-i="${i}"><div class="row"><span class="plate">${safe(x.car||x.lineName||'清運點')}</span><span class="badge">${x.dataType==='SCHEDULE'?'表定':'動態'}</span></div><div class="sub">${safe(x.location||x.cityname||'')}</div><div class="sub">${x.dataType==='SCHEDULE'?'抵達 '+safe(x.arrival||x.time):'GPS '+safe(x.time)}${x.lineid?'｜'+safe(x.lineid):''}</div></div>`).join(''):`<div class="empty">目前官方資料沒有可顯示項目。<br>即時來源在非清運時段可能為零筆。</div>`;$('count').textContent=data.length;document.querySelectorAll('.card').forEach((e,i)=>e.onclick=()=>{const x=data[i];if(valid(x))map.flyTo([+x.latitude,+x.longitude],16)})}
function state(){const t=meta.fetchedAt?new Date(meta.fetchedAt):null,age=t?(Date.now()-t)/60000:99999,cfg=CFG[city];$('source').textContent=cfg.label;$('source').className='status';let s=t?`取得：${t.toLocaleString('zh-TW',{hour12:false})}`:'尚無同步資料';if(meta.error)s+=`｜同步失敗，保留上次資料`;else if(age>Math.max(40,cfg.interval/60*3))s+=`｜資料可能過期`;$('fresh').textContent=s;$('fresh').className='status '+(meta.error?'error':age>Math.max(40,cfg.interval/60*3)?'warn':'');}
async function load(){try{const r=await fetch(`./data/${CFG[city].file}?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);const j=await r.json();rows=Array.isArray(j.records)?j.records:[];meta=j.meta||{};next=CFG[city].interval;state();render()}catch(e){rows=[];meta={error:String(e)};state();render()}}
function renderLandmarks(){lmLayer.clearLayers();$('chips').innerHTML=landmarks.length?landmarks.map(x=>`<span class="chip">${safe(x.name)} ${x.radius}m <button data-r="${x.id}">×</button></span>`).join(''):'<span class="legend">尚未新增</span>';landmarks.forEach(x=>{L.marker([x.lat,x.lng]).bindPopup(`<b>${safe(x.name)}</b>`).addTo(lmLayer);L.circle([x.lat,x.lng],{radius:x.radius,color:'#7c3aed',fillOpacity:.08}).addTo(lmLayer)});localStorage.setItem(STORE,JSON.stringify(landmarks));document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{landmarks=landmarks.filter(x=>x.id!=b.dataset.r);renderLandmarks()})}
function openLm(p){pending=p;$('coords').value=`${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;$('modal').classList.add('show')}function closeLm(){$('modal').classList.remove('show')}
window.addEventListener('load',()=>{map=L.map('map').setView(CFG[city].center,CFG[city].zoom);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);layer=L.layerGroup().addTo(map);lmLayer=L.layerGroup().addTo(map);map.on('click',e=>openLm(e.latlng));renderLandmarks();load();setInterval(()=>{next=Math.max(0,next-1);$('timer').textContent=`下次檢查 ${String(Math.floor(next/60)).padStart(2,'0')}:${String(next%60).padStart(2,'0')}`;if(next===0)load()},1000);setTimeout(()=>map.invalidateSize(),200)});
$('city').onchange=e=>{city=e.target.value;map.setView(CFG[city].center,CFG[city].zoom);load()};$('refresh').onclick=load;$('search').oninput=render;document.querySelectorAll('.flt').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.flt').forEach(x=>x.classList.toggle('green',x===b));render()});$('locate').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{const q={lat:p.coords.latitude,lng:p.coords.longitude};map.setView([q.lat,q.lng],16);openLm(q)},()=>alert('無法取得位置，請確認定位權限。'),{enableHighAccuracy:true,timeout:10000}):alert('瀏覽器不支援定位');$('mx').onclick=$('cancel').onclick=closeLm;$('save').onclick=()=>{if(!pending)return;landmarks.push({id:Date.now(),name:$('lname').value.trim()||'未命名地標',lat:pending.lat,lng:pending.lng,radius:Math.max(50,Math.min(5000,+$('radius').value||200))});closeLm();renderLandmarks()};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
