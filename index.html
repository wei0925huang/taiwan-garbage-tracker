p:wrap}.bar.soft{background:#f8fafc}.grow{flex:1;min-width:220px}.status{font-size:12px;color:#475569;background:#f1f5f9;border-radius:8px;padding:7px 9px}.warn{color:#b45309;background:#fffbeb}.error{color:#be123c;background:#fff1f2}.sourcebox{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}.sourcebox label{display:flex;align-items:center;gap:4px;background:#f1f5f9;border:1px solid var(--line);border-radius:8px;padding:6px 8px}.mapbox{flex:1;min-height:0;padding:8px;background:#f1f5f9}.map{height:100%;min-height:360px;border-radius:11px}.sidehead{flex:0 0 auto;padding:11px 12px;border-bottom:1px solid var(--line);background:#f8fafc;display:flex;justify-content:space-between;font-size:13px}.list{flex:1;min-height:0;overflow-y:auto;padding:10px;border-bottom:1px solid var(--line)}.card{position:relative;padding:11px 11px 11px 15px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:#f8fafc;cursor:pointer;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--city)}.card:hover{background:#ecfdf5}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.plate{font-weight:800}.badge{font-size:11px;border-radius:6px;padding:2px 6px;background:#fff;border:1px solid #cbd5e1}.sub{font-size:12px;color:#475569;margin-top:5px}.empty{text-align:center;padding:35px 12px;color:var(--muted);font-size:13px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:5px;background:#eff6ff;color:#1d4ed8;border:1px solid #93c5fd;border-radius:8px;padding:5px 7px;font-size:11px}.chip.off{background:#f1f5f9;color:#94a3b8;border-color:#cbd5e1}.chip .link{cursor:pointer;font-weight:700}.chip button{border:0;background:none;color:#e11d48;font-weight:900;cursor:pointer}.legend{font-size:11px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0f172a99;z-index:1100;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.dialog{width:min(460px,100%);background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px #0005}.dh{padding:14px 16px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:space-between}.db{padding:16px;display:grid;gap:11px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.db label{font-size:12px;font-weight:700}.df{padding:12px 16px;background:#f8fafc;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.alert{position:fixed;right:15px;top:84px;z-index:1200;width:min(390px,calc(100% - 30px));background:var(--rose);color:#fff;padding:14px;border-radius:14px;box-shadow:0 18px 45px #0f172a55;display:none}.alert.show{display:block}.alerttop{display:flex;gap:10px;align-items:flex-start}.alertmsg{font-size:13px;margin-top:5px}.countdown{display:inline-block;margin-top:8px;padding:3px 7px;border-radius:6px;background:#be123c;font-size:11px}.city-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.scroll::-webkit-scrollbar,.list::-webkit-scrollbar{width:7px}.scroll::-webkit-scrollbar-thumb,.list::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:5px}
@media(max-width:900px){html,body{height:auto;min-height:100%}body{overflow:auto}.app{height:auto;min-height:100dvh}.headin{align-items:flex-start;flex-direction:column}.actions{width:100%}.layout{display:flex;flex-direction:column;overflow:visible;padding:8px}.left,.side{overflow:hidden}.mapbox{height:52dvh;min-height:350px;flex:none}.map{min-height:350px}.side{height:58dvh;min-height:360px}.list{overflow-y:auto}.grow{min-width:100%;order:8}.desk{display:none}}

<body><div class="app">
<header class="head"><div class="headin"><div class="brand"><div class="logo">♻</div><div><h1>三市垃圾車資訊整合</h1><p>臺北表定點位｜新北即時 GPS｜臺中動態車輛</p></div></div><div class="actions"><select id="viewMode" class="field"><option value="all">三市整合｜全部資料</option><option value="newtaipei">新北市｜即時 GPS</option><option value="taichung">臺中市｜動態車輛</option><option value="taipei">臺北市｜表定點位</option></select><button id="audioBtn" class="btn">🔊 啟用音效</button><button id="locateBtn" class="btn blue">◎ 我的位置</button><button id="addLandmarkBtn" class="btn">＋ 新增地標</button><button id="refreshBtn" class="btn primary">↻ 更新</button></div></div></header>
<main class="layout"><section class="panel left"><div class="bar soft compact-top"><span id="sourceStatus" class="status">載入中…</span><span id="freshStatus" class="status"></span><span id="timer" class="status desk"></span><div class="sourcebox"><b>資料來源：</b><label><input class="cityCheck" type="checkbox" value="newtaipei" checked><span class="city-dot" style="background:#16a34a"></span>新北</label><label><input class="cityCheck" type="checkbox" value="taichung" checked><span class="city-dot" style="background:#f97316"></span>臺中</label><label><input class="cityCheck" type="checkbox" value="taipei" checked><span class="city-dot" style="background:#2563eb"></span>臺北</label><button id="selectAll" class="btn">全選</button><button id="clearAll" class="btn">全部取消</button></div></div><div class="bar search-row"><input id="search" class="field grow" placeholder="搜尋車牌、路線、行政區或地點"><button class="btn filter" data-filter="ALL">全部</button><button class="btn primary filter" data-filter="DYNAMIC">動態車輛</button><button class="btn filter" data-filter="POINT">停靠／表定點</button></div><div class="bar soft landmark-row"><b style="font-size:12px">📍 本機地標：</b><div id="chips" class="chips grow"></div><span id="pickHint" class="legend">請使用上方「新增地標」按鈕</span><button id="cancelPickBtn" class="btn danger" style="display:none">取消選點</button></div><div class="mapbox"><div id="map" class="map"></div></div></section>
<section class="panel side"><div class="sidehead"><b>資料清單</b><span>顯示 <b id="count">0</b> 筆</span></div><div id="list" class="list"></div></section></main></div>
<div id="modal" class="modal"><div class="dialog"><div class="dh"><b id="modalTitle">新增監控地標與音樂設定</b><button id="modalX" class="btn">×</button></div><div class="db"><label>地標名稱<input id="lmName" class="field" style="width:100%;margin-top:5px" placeholder="例如：公司、家"></label><div class="grid2"><label>開始時間<input id="lmStart" type="time" value="06:00" class="field" style="width:100%;margin-top:5px"></label><label>結束時間<input id="lmEnd" type="time" value="22:00" class="field" style="width:100%;margin-top:5px"></label></div><div class="grid2"><label>提醒半徑（公尺）<input id="lmRadius" type="number" min="50" max="5000" step="50" value="200" class="field" style="width:100%;margin-top:5px"></label><label>指定提示音<select id="lmMusic" class="field" style="width:100%;margin-top:5px"><option value="furElise">給愛麗絲</option><option value="maidenPrayer">少女的祈禱</option><option value="beep">單聲道短嗶聲</option><option value="doubleBeep">急促雙響嗶聲</option></select></label></div><label style="display:flex;align-items:center;gap:7px"><input id="lmEnabled" type="checkbox" checked>啟用此地標提醒</label><div class="legend">座標：<span id="lmCoords"></span></div></div><div class="df"><button id="cancelLm" class="btn">取消</button><button id="saveLm" class="btn blue">儲存設定</button></div></div></div>
<div id="alertBanner" class="alert"><div class="alerttop"><div style="font-size:24px">🔔</div><div style="flex:1"><b>垃圾車接近地標提醒！</b><div id="alertMsg" class="alertmsg"></div><div id="audioHint" class="alertmsg" style="display:none;font-weight:700">瀏覽器尚未啟用聲音，請按上方「啟用音效」。</div><div class="countdown">自動關閉倒數：<b id="alertCountdown">10</b>s</div></div><button id="dismissAlert" class="btn">×</button></div></div>
<script>
const $=id=>document.getElementById(id);
const CFG={newtaipei:{file:'newtaipei-live.json',name:'新北市',type:'即時 GPS',color:'#16a34a'},taichung:{file:'taichung-live.json',name:'臺中市',type:'動態車輛',color:'#f97316'},taipei:{file:'taipei-schedule.json',name:'臺北市',type:'表定點位',color:'#2563eb'}};
const LM_KEY='tw_garbage_landmarks_v2',AUDIO_KEY='tw_garbage_audio_muted_v2';
let map,vehicleLayer,landmarkLayer;let datasets={newtaipei:[],taichung:[],taipei:[]},metas={};let filter='DYNAMIC',viewMode='all',selectedCities=new Set(['newtaipei','taichung','taipei']);let landmarks=JSON.parse(localStorage.getItem(LM_KEY)||'[]');let editingId=null,pendingPoint=null,pickMode=false,pickBlockedUntil=0,dragMoved=false,locationMarker=null,locationCircle=null;let audioEnabled=false,muted=localStorage.getItem(AUDIO_KEY)==='1',audioCtx=null,musicTimer=null,alertTimer=null,alertQueue=[],alertActive=false,insideKeys=new Set(),secondsLeft=600;
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const valid=x=>Number.isFinite(+x.latitude)&&Number.isFinite(+x.longitude)&&+x.latitude>21&&+x.latitude<26.6&&+x.longitude>118&&+x.longitude<123;
function saveLandmarks(){localStorage.setItem(LM_KEY,JSON.stringify(landmarks))}
function cityOf(x){return x.cityKey||(x.dataType==='LIVE_GPS'?'newtaipei':x.dataType==='DYNAMIC_DATA'?'taichung':'taipei')}
function allRows(){return Object.entries(datasets).flatMap(([k,a])=>a.map(x=>({...x,cityKey:k})))}
function currentRows(){const q=$('search').value.trim().toLowerCase();return allRows().filter(x=>{const k=cityOf(x);if(!selectedCities.has(k))return false;if(viewMode!=='all'&&k!==viewMode)return false;const dynamic=x.dataType!=='SCHEDULE';const stopped=x.dataType==='SCHEDULE'||(x.dataType==='DYNAMIC_DATA'&&+x.speed===0);if(filter==='DYNAMIC'&&!dynamic)return false;if(filter==='POINT'&&!stopped)return false;const t=`${x.car} ${x.lineid} ${x.lineName} ${x.location} ${x.cityname} ${x.village||''}`.toLowerCase();return !q||t.includes(q)})}
function markerIcon(x){const k=cityOf(x),cfg=CFG[k],symbol=x.dataType==='SCHEDULE'?'●':'♻';return L.divIcon({html:`<div style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:${cfg.color};color:white;border:2px solid white;box-shadow:0 2px 7px #0004;font-weight:bold">${symbol}</div>`,className:'',iconSize:[30,30],iconAnchor:[15,15]})}
function render(){const rows=currentRows();vehicleLayer.clearLayers();const bounds=[];rows.filter(valid).forEach(x=>{const k=cityOf(x),cfg=CFG[k],time=x.dataType==='SCHEDULE'?`表定抵達：${safe(x.arrival||x.time)}${x.departure?'<br>表定離開：'+safe(x.departure):''}`:`GPS 回報：${safe(x.time)}`;L.marker([+x.latitude,+x.longitude],{icon:markerIcon(x)}).bindPopup(`<b>${safe(x.car||x.lineName||'清運點')}</b><br>${cfg.name}｜${cfg.type}<br>${safe(x.location)}<br>${time}${x.speed!==null&&x.speed!==undefined?'<br>速度：'+safe(x.speed)+' km/h':''}`).addTo(vehicleLayer);bounds.push([+x.latitude,+x.longitude])});$('list').innerHTML=rows.length?rows.map(x=>{const k=cityOf(x),cfg=CFG[k],title=x.car||x.lineName||'清運點',time=x.dataType==='SCHEDULE'?`抵達 ${safe(x.arrival||x.time)}${x.departure?'｜離開 '+safe(x.departure):''}`:`GPS ${safe(x.time)}`,extra=x.speed!==null&&x.speed!==undefined?`｜${safe(x.speed)} km/h`:'';return `<div class="card" style="--city:${cfg.color}" data-key="${safe(k+'|'+(x.car||'')+'|'+(x.lineid||'')+'|'+x.latitude+'|'+x.longitude)}"><div class="row"><span class="plate">${safe(title)}</span><span class="badge">${cfg.name}｜${cfg.type}</span></div><div class="sub">${safe(x.location||x.cityname||'')}</div><div class="sub">${time}${x.lineid?'｜'+safe(x.lineid):''}${extra}</div></div>`}).join(''):'<div class="empty">目前沒有符合條件的官方資料。</div>';$('count').textContent=rows.length;document.querySelectorAll('.card').forEach((e,i)=>e.onclick=()=>{const x=rows[i];if(valid(x))map.flyTo([+x.latitude,+x.longitude],16)});checkProximity();return bounds}
function fitCurrent(){const b=render();if(viewMode==='all'&&b.length>1)map.fitBounds(b,{padding:[25,25],maxZoom:12});else if(b.length===1)map.setView(b[0],15);else{const fallback=viewMode==='taichung'?[24.163,120.648]:viewMode==='taipei'?[25.0375,121.5637]:viewMode==='newtaipei'?[25.012,121.466]:[24.55,121.05];map.setView(fallback,viewMode==='all'?8:11)}}
function renderLandmarks(){landmarkLayer.clearLayers();const musicNames={furElise:'給愛麗絲',maidenPrayer:'少女的祈禱',beep:'短嗶聲',doubleBeep:'雙響聲'};$('chips').innerHTML=landmarks.length?landmarks.map(x=>`<span class="chip ${x.enabled?'':'off'}"><input type="checkbox" data-toggle="${x.id}" ${x.enabled?'checked':''}><span class="link" data-edit="${x.id}">${safe(x.name)}｜${x.radius}m｜${musicNames[x.music]||'音樂'}</span><button data-remove="${x.id}">×</button></span>`).join(''):'<span class="legend">尚未新增地標</span>';landmarks.filter(x=>x.enabled).forEach(x=>{const icon=L.divIcon({html:`<div style="width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#7c3aed;color:white;border:2px solid white;box-shadow:0 2px 7px #0004">📍</div>`,className:'',iconSize:[31,31],iconAnchor:[15,15]});L.marker([x.lat,x.lng],{icon}).bindPopup(`<b>${safe(x.name)}</b><br>半徑 ${x.radius}m`).addTo(landmarkLayer);L.circle([x.lat,x.lng],{radius:x.radius,color:'#7c3aed',fillOpacity:.08}).addTo(landmarkLayer)});saveLandmarks();document.querySelectorAll('[data-toggle]').forEach(e=>e.onchange=()=>{const x=landmarks.find(v=>v.id==e.dataset.toggle);x.enabled=e.checked;renderLandmarks();checkProximity()});document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>openLandmark(landmarks.find(v=>v.id==e.dataset.edit)));document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{const id=+e.dataset.remove;landmarks=landmarks.filter(v=>v.id!==id);insideKeys=new Set([...insideKeys].filter(k=>!k.endsWith('|'+id)));renderLandmarks()})}
function openLandmark(x){editingId=x?.id||null;if(x)pendingPoint={lat:x.lat,lng:x.lng};$('modalTitle').textContent=x?`修改地標【${x.name}】`:'新增監控地標與音樂設定';$('lmName').value=x?.name||'';$('lmStart').value=x?.startTime||'06:00';$('lmEnd').value=x?.endTime||'22:00';$('lmRadius').value=x?.radius||200;$('lmMusic').value=x?.music||'furElise';$('lmEnabled').checked=x?.enabled!==false;$('lmCoords').textContent=pendingPoint?`${pendingPoint.lat.toFixed(5)}, ${pendingPoint.lng.toFixed(5)}`:'';$('modal').classList.add('show')}
function closeLandmark(){$('modal').classList.remove('show');editingId=null;if(pickMode)exitPickMode('已取消選點')}
function inTimeRange(lm){const now=new Date(),cur=now.getHours()*60+now.getMinutes(),toMin=s=>{const [h,m]=(s||'00:00').split(':').map(Number);return h*60+m},a=toMin(lm.startTime),b=toMin(lm.endTime);return a<=b?cur>=a&&cur<=b:cur>=a||cur<=b}
function distance(a,b,c,d){const R=6371e3,p1=a*Math.PI/180,p2=c*Math.PI/180,dp=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180,q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
function checkProximity(){const activeVehicles=allRows().filter(x=>x.dataType!=='SCHEDULE'&&valid(x));const nowInside=new Set();for(const x of activeVehicles){const k=cityOf(x);for(const lm of landmarks){if(!lm.enabled||!inTimeRange(lm))continue;const d=distance(lm.lat,lm.lng,+x.latitude,+x.longitude),key=`${k}|${x.car||x.lineid}|${lm.id}`;if(d<=lm.radius){nowInside.add(key);if(!insideKeys.has(key))enqueueAlert({city:CFG[k].name,car:x.car||x.lineid||'垃圾車',landmark:lm.name,distance:Math.round(d),music:lm.music||'beep'})}}insideKeys=nowInside}
}
function initAudio(){audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function playTone(freq,time,duration){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,time);g.gain.setValueAtTime(.14,time);g.gain.exponentialRampToValueAtTime(.001,time+duration);o.connect(g);g.connect(audioCtx.destination);o.start(time);o.stop(time+duration)}
function playMelody(type){if(muted)return 1000;initAudio();const n=audioCtx.currentTime;if(type==='beep'){playTone(880,n,.3);return 500}if(type==='doubleBeep'){playTone(880,n,.15);playTone(880,n+.22,.15);return 600}const notes=type==='maidenPrayer'?[[659,0,.25],[587,.25,.25],[523,.5,.25],[587,.75,.25],[659,1,.25],[784,1.25,.5]]:[[659,0,.2],[622,.2,.2],[659,.4,.2],[622,.6,.2],[659,.8,.2],[494,1,.2],[587,1.2,.2],[523,1.4,.2],[440,1.6,.4]];notes.forEach(x=>playTone(x[0],n+x[1],x[2]));return 2400}
function startMusic(type){stopMusic();const loop=()=>{musicTimer=setTimeout(loop,playMelody(type))};loop()}
function stopMusic(){if(musicTimer){clearTimeout(musicTimer);musicTimer=null}}
function enqueueAlert(a){alertQueue.push(a);showNextAlert()}
function showNextAlert(){if(alertActive||!alertQueue.length)return;alertActive=true;const a=alertQueue.shift();$('alertMsg').textContent=`${a.city}車號 ${a.car} 已接近【${a.landmark}】約 ${a.distance} 公尺！`;$('alertBanner').classList.add('show');$('audioHint').style.display=audioEnabled&&!muted?'none':'block';if(audioEnabled&&!muted)startMusic(a.music);let n=10;$('alertCountdown').textContent=n;clearInterval(alertTimer);alertTimer=setInterval(()=>{n--;$('alertCountdown').textContent=n;if(n<=0)dismissAlert()},1000)}
function dismissAlert(){clearInterval(alertTimer);stopMusic();$('alertBanner').classList.remove('show');alertActive=false;setTimeout(showNextAlert,150)}
function updateAudioButton(){if(!audioEnabled)$('audioBtn').textContent='🔊 啟用音效';else $('audioBtn').textContent=muted?'🔇 已靜音':'🔊 音效已啟用'}
function enterPickMode(){pickMode=true;dragMoved=false;document.body.classList.add('pick-mode');$('pickHint').textContent='請在地圖上點選地標位置';$('cancelPickBtn').style.display='inline-block'}
function exitPickMode(msg='請使用上方「新增地標」按鈕'){pickMode=false;document.body.classList.remove('pick-mode');$('pickHint').textContent=msg;$('cancelPickBtn').style.display='none';setTimeout(()=>{if(!pickMode)$('pickHint').textContent='請使用上方「新增地標」按鈕'},1500)}
function showMyLocation(pos){const lat=pos.coords.latitude,lng=pos.coords.longitude,acc=pos.coords.accuracy||0;if(locationMarker)map.removeLayer(locationMarker);if(locationCircle)map.removeLayer(locationCircle);const ico=L.divIcon({html:'<div class="location-dot"></div>',className:'',iconSize:[20,20],iconAnchor:[10,10]});locationMarker=L.marker([lat,lng],{icon:ico}).bindPopup(`我的位置<br>精度約 ${Math.round(acc)} 公尺`).addTo(map);locationCircle=L.circle([lat,lng],{radius:acc,color:'#2563eb',fillColor:'#3b82f6',fillOpacity:.1,weight:1}).addTo(map);map.setView([lat,lng],16);$('locateBtn').textContent='◎ 已定位';setTimeout(()=>$('locateBtn').textContent='◎ 我的位置',1500)}
async function loadData(){const keys=Object.keys(CFG);await Promise.all(keys.map(async k=>{try{const r=await fetch(`./data/${CFG[k].file}?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);const j=await r.json();datasets[k]=Array.isArray(j.records)?j.records:[];metas[k]=j.meta||{}}catch(e){metas[k]={error:String(e)};datasets[k]=datasets[k]||[]}}));secondsLeft=600;updateStatus();fitCurrent()}
function updateStatus(){const total=Object.values(datasets).reduce((n,a)=>n+a.length,0),errors=Object.values(metas).filter(m=>m.error).length;$('sourceStatus').textContent=`三市官方資料｜共 ${total} 筆`;$('freshStatus').textContent=errors?`${errors} 個來源同步失敗，保留現有資料`:'三市資料載入完成';$('freshStatus').className='status '+(errors?'error':'')}
window.addEventListener('load',()=>{map=L.map('map').setView([24.55,121.05],8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);vehicleLayer=L.layerGroup().addTo(map);landmarkLayer=L.layerGroup().addTo(map);map.on('dragstart zoomstart',()=>{dragMoved=true;pickBlockedUntil=Date.now()+350});map.on('dragend zoomend',()=>{pickBlockedUntil=Date.now()+350;setTimeout(()=>dragMoved=false,360)});map.on('click',e=>{if(!pickMode||dragMoved||Date.now()<pickBlockedUntil)return;pendingPoint={lat:e.latlng.lat,lng:e.latlng.lng};exitPickMode('已選取位置');openLandmark(null)});updateAudioButton();renderLandmarks();loadData();setInterval(()=>{secondsLeft--;if(secondsLeft<=0)loadData();$('timer').textContent=`下次檢查 ${String(Math.floor(secondsLeft/60)).padStart(2,'0')}:${String(secondsLeft%60).padStart(2,'0')}`},1000);setTimeout(()=>map.invalidateSize(),200);window.addEventListener('resize',()=>setTimeout(()=>map.invalidateSize(),80));new ResizeObserver(()=>setTimeout(()=>map.invalidateSize(),60)).observe(document.querySelector('.mapbox'))});
$('viewMode').onchange=e=>{viewMode=e.target.value;if(viewMode==='all'){selectedCities=new Set(['newtaipei','taichung','taipei']);document.querySelectorAll('.cityCheck').forEach(x=>x.checked=true)}else{selectedCities=new Set([viewMode]);document.querySelectorAll('.cityCheck').forEach(x=>x.checked=x.value===viewMode)}fitCurrent()};$('search').oninput=render;$('refreshBtn').onclick=loadData;$('selectAll').onclick=()=>{selectedCities=new Set(['newtaipei','taichung','taipei']);document.querySelectorAll('.cityCheck').forEach(x=>x.checked=true);viewMode='all';$('viewMode').value='all';fitCurrent()};$('clearAll').onclick=()=>{selectedCities.clear();document.querySelectorAll('.cityCheck').forEach(x=>x.checked=false);render()};document.querySelectorAll('.cityCheck').forEach(x=>x.onchange=()=>{x.checked?selectedCities.add(x.value):selectedCities.delete(x.value);viewMode='all';$('viewMode').value='all';render()});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('primary',x===b));render()});$('audioBtn').onclick=()=>{if(!audioEnabled){audioEnabled=true;muted=false;initAudio();playMelody('beep')}else{muted=!muted;if(muted)stopMusic();else{initAudio();playMelody('beep')}}localStorage.setItem(AUDIO_KEY,muted?'1':'0');updateAudioButton();if(alertActive&&!muted){$('audioHint').style.display='none'}};$('locateBtn').onclick=()=>{if(!navigator.geolocation){alert('此瀏覽器不支援定位。');return}$('locateBtn').textContent='定位中…';navigator.geolocation.getCurrentPosition(showMyLocation,()=>{$('locateBtn').textContent='◎ 我的位置';alert('無法取得目前位置，請確認瀏覽器定位權限。')},{enableHighAccuracy:true,timeout:10000})};$('addLandmarkBtn').onclick=enterPickMode;$('cancelPickBtn').onclick=()=>exitPickMode('已取消選點');document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pickMode)exitPickMode('已取消選點')});$('modalX').onclick=$('cancelLm').onclick=closeLandmark;$('saveLm').onclick=()=>{if(!pendingPoint)return;const obj={id:editingId||Date.now(),name:$('lmName').value.trim()||'未命名地標',lat:pendingPoint.lat,lng:pendingPoint.lng,enabled:$('lmEnabled').checked,startTime:$('lmStart').value||'00:00',endTime:$('lmEnd').value||'23:59',radius:Math.max(50,Math.min(5000,+$('lmRadius').value||200)),music:$('lmMusic').value};landmarks=editingId?landmarks.map(x=>x.id===editingId?obj:x):[...landmarks,obj];$('modal').classList.remove('show');editingId=null;renderLandmarks();checkProximity()};$('dismissAlert').onclick=dismissAlert;
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
